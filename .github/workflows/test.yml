name: test

# core is plain Dart. It depends on reticulum-dart by path (../reticulum-dart),
# and both on zx, the stores' database (../../x1watt/zx), so those are cloned
# next to it.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout core
        uses: actions/checkout@v4
        with:
          path: core

      - name: Fetch reticulum-dart and zx (path dependencies)
        shell: bash
        run: |
          git clone -q --depth 1 https://github.com/xprs-dev/reticulum-dart.git reticulum-dart
          # ../../x1watt/zx as seen from core/ and from reticulum-dart/
          mkdir -p ../x1watt
          git clone -q --depth 1 https://github.com/x1watt/zx.git ../x1watt/zx

      - uses: dart-lang/setup-dart@v1

      - name: Analyze and test
        working-directory: core
        run: |
          dart pub get
          dart analyze
          dart test
